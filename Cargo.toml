[package]
name = "divus-factus"
version = "0.3.27"
edition = "2024"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
bevy = { version = "0.19.0", features = ["serialize", "wav", "file_watcher"] }
# Brett's own UI kit, at ../Ordo. A PATH dependency on purpose: while both move
# together a path is what you want, and a pinned rev is what you want the day
# this ships against it. See ../Ordo/FIRST-PORT.md - this is that first port,
# and the point of it is to find out what is wrong with Ordo.
ordo = { path = "../Ordo" }
# Temporary: names systems and components in B0001 conflict panics.
bevy_ecs = { version = "0.19.0", features = ["debug"] }
# The one other dependency, for save files. Hand-rolling serialization for a
# whole living village is where the write-it-here philosophy stops paying.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The villagers' own words. A small language model, in-process, on the player's
# own machine — no daemon to install, no server to reach, nothing for anyone to
# do but launch the game. Pure Rust (no C++ toolchain), Metal on Apple silicon
# and CPU everywhere else.
#
# Weights are NOT compiled in: they sit beside the game's saves, fetched once by
# the launcher, and the game speaks its written lines when they are absent.

[target.'cfg(target_os = "macos")'.dependencies]
# Solely to mark the teller's thread as background work, so its cores always
# yield to the frame.
libc = "0.2"

# Bevy is far too slow in a fully unoptimized debug build. Optimizing dependencies
# while leaving our own crate unoptimized keeps iteration fast and the game playable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
# Line tables, not the full symbol tree. On macOS the dev profile writes
# its debug info UNPACKED - one .o file per codegen unit, kept forever
# beside the binary - and this folder had reached two hundred and
# thirty-five gigabytes on ninety-seven thousand of them. Brett: "the
# Divus Factus folder is over 300gb...why is that?" The game itself is
# forty megabytes.
#
# Line tables still name the file and line in every panic and backtrace,
# which is the only debug information this project has ever actually
# used, and they cost a fraction of the space.
debug = "line-tables-only"
