[package]
name = "divus-factus"
version = "0.3.39"
edition = "2024"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[features]
# THE LIVING VOICE IS A TOOL, NOT A PRODUCT. Brett: "The living voice will be
# stripped out before launch. It is just my way of generating dialogue."
#
# So it is a feature and not a module somebody has to remember to delete.
# Building without it takes the whole thing out - the module, the settings
# switch, and `reqwest` with its TLS stack - which means a release cannot make
# a network call rather than merely being unlikely to. That is a far better
# thing to be able to say, and it is checked by the compiler instead of by a
# person going through a checklist on release day.
#
# `cargo run --features living-voice` to author dialogue. Plain `cargo build`
# for anything a player would ever run.
living-voice = ["dep:reqwest"]

[dependencies]
# THE CORPUS AT SCALE. Brett means to ship over a million lines, and a million
# lines cannot be a folder of JSON parsed into memory at startup - that is
# hundreds of megabytes and several seconds before the game can open. SQLite
# reads only the handful of lines a moment can actually use.
#
# `bundled` compiles SQLite itself into the binary rather than trusting
# whatever the player's machine has, which is the same reason the living voice
# uses rustls.
rusqlite = { version = "0.32", features = ["bundled"] }
bevy = { version = "0.19.0", features = ["serialize", "wav", "file_watcher"] }
# The living voice's one call out of the process, and OPTIONAL - see the
# `living-voice` feature. Blocking on purpose: it runs on its own worker thread
# and the game never waits for it, so an async runtime would be a second
# scheduler bought for nothing. rustls rather than the system's TLS, so a
# release does not depend on what the player's machine has.
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
# Brett's own UI kit, at ../Ordo. A PATH dependency on purpose: while both move
# together a path is what you want, and a pinned rev is what you want the day
# this ships against it. See ../Ordo/FIRST-PORT.md - this is that first port,
# and the point of it is to find out what is wrong with Ordo.
ordo = { path = "../Ordo" }
# Temporary: names systems and components in B0001 conflict panics.
bevy_ecs = { version = "0.19.0", features = ["debug"] }
# The one other dependency, for save files. Hand-rolling serialization for a
# whole living village is where the write-it-here philosophy stops paying.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The villagers' own words. A small language model, in-process, on the player's
# own machine — no daemon to install, no server to reach, nothing for anyone to
# do but launch the game. Pure Rust (no C++ toolchain), Metal on Apple silicon
# and CPU everywhere else.
#
# Weights are NOT compiled in: they sit beside the game's saves, fetched once by
# the launcher, and the game speaks its written lines when they are absent.

[target.'cfg(target_os = "macos")'.dependencies]
# Solely to mark the teller's thread as background work, so its cores always
# yield to the frame.
libc = "0.2"

# Bevy is far too slow in a fully unoptimized debug build. Optimizing dependencies
# while leaving our own crate unoptimized keeps iteration fast and the game playable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
# Line tables, not the full symbol tree. On macOS the dev profile writes
# its debug info UNPACKED - one .o file per codegen unit, kept forever
# beside the binary - and this folder had reached two hundred and
# thirty-five gigabytes on ninety-seven thousand of them. Brett: "the
# Divus Factus folder is over 300gb...why is that?" The game itself is
# forty megabytes.
#
# Line tables still name the file and line in every panic and backtrace,
# which is the only debug information this project has ever actually
# used, and they cost a fraction of the space.
debug = "line-tables-only"
