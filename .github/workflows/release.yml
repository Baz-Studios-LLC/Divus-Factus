name: Release

# Build the native game for macOS (Apple Silicon) + Windows (x64) and attach
# the builds to the release for the tag, in the studio's launcher convention:
# asset names end in -macos-aarch64.app.tar.gz / -windows-x86_64.zip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build + attach assets to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Ordo lives BESIDE the game, not inside it - `ordo = { path = "../Ordo" }`
      # - because it is the studio's shared UI kit, not this game's module.
      # The runner has to stand the neighbourhood up the same way the desk
      # does. A plain clone, because the kit is public like everything else
      # in the org; the first release after the Ordo port failed in thirty-
      # eight seconds for want of this step.
      - name: Stand Ordo beside the game
        shell: bash
        run: git clone --depth 1 https://github.com/Baz-Studios-LLC/Ordo.git ../Ordo

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      # The bench is its own crate with its own lockfile, so the workspace build
      # above does not touch it. It ships inside the game's bundle and the title
      # screen opens it.
      - name: Build Opificium (release)
        run: cargo build --release --manifest-path opificium/Cargo.toml

      - name: Compute version (tag without leading v)
        id: ver
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package — macOS .app.tar.gz
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos-app.sh target/release/divus-factus "${{ steps.ver.outputs.version }}" build
          mkdir -p dist
          tar -czf "dist/DivusFactus-macos-aarch64.app.tar.gz" -C build DivusFactus.app

      - name: Package — Windows .zip (binary + assets)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, stage | Out-Null
          Copy-Item target\release\divus-factus.exe stage\DivusFactus.exe
          Copy-Item -Recurse assets stage\assets
          # The bench beside it, and the palette it paints from; its fonts come
          # out of the assets folder already copied above.
          # NAMED so it cannot be mistaken for the game, and named so it sorts
          # after it: a launcher that takes the first .exe in the folder took
          # `divus-factus-atelier.exe` and opened the editor when a player
          # pressed PLAY.
          Copy-Item opificium\target\release\divus-factus-opificium.exe stage\Opificium.exe
          Copy-Item -Recurse opificium\data stage\data
          Compress-Archive -Path stage\* -DestinationPath dist\DivusFactus-windows-x86_64.zip -Force

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          # The launcher shows the release body as patch notes, and it may
          # fetch the release the second it exists - so the notes must be
          # IN the release from birth. RELEASE_NOTES.md is updated as part
          # of every version-bump commit; the generated section (a compare
          # link) is appended after it.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
